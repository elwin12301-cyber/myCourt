# PostgreSQL for the myCourt backend (development only; the credentials are throw-away and the data is fictional).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mycourt
      POSTGRES_PASSWORD: mycourt
      POSTGRES_DB: mycourt
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mycourt-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycourt -d mycourt"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mycourt-pg:

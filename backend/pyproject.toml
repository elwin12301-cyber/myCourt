[project]
name = "mycourt-backend"
version = "0.1.0"
description = "API for the myCourt prototype: fictional demonstration data only, never real court records."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a running PostgreSQL (MYCOURT_TEST_POSTGRES_URL)"]
addopts = "-m 'not postgres'"
